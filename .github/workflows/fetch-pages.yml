name: Scan élargi (test)
on:
  push:
    branches: [scan-debug]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe3/probe.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add probe3
          git commit -qm "probe3" && git push -q origin HEAD:scan-debug
