name: Scan élargi (test)
on:
  push:
    branches: [scan-debug]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/scan_maroc.py | tee scan-log.txt
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data scan-log.txt
          git commit -qm "scan-test" && git push -q origin HEAD:scan-debug
