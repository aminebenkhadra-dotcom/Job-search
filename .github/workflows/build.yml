name: Construire l'APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk RadarEmploi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RadarEmploi-apk
          path: RadarEmploi.apk
          retention-days: 30
      - name: Publier l'APK (release et branche apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version RadarEmploi.apk --title "Radar Emploi · dernière version" --notes "APK compilé depuis ${GITHUB_SHA::7}. Sur le téléphone : touchez RadarEmploi.apk pour l'installer."
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rfq --cached .
          git add -f RadarEmploi.apk
          git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f origin apk
